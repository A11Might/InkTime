<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkTime · 每日一忆</title>
<link rel="stylesheet" href="/static/style.css?v=20260920b">
<script>
  /* 首帧前定主题，避免深色用户看到白闪 */
  (function () {
    var t = localStorage.getItem("inktime-theme");
    if (t !== "light" && t !== "dark") {
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <div class="topbar-left">
      <div class="brand">InkTime<span class="brand-dot">.</span></div>
      <nav class="nav-tabs">
        <a class="nav-tab active" href="/">工作台</a>
        <a class="nav-tab" href="/latest">碰一碰</a>
      </nav>
    </div>
    <div class="topbar-right">
      <a class="gh-link" href="https://github.com/A11Might/InkTime" target="_blank" rel="noopener" aria-label="GitHub 仓库" title="GitHub 仓库">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
        <span class="ext-arrow" aria-hidden="true">↗</span>
      </a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<section class="container masthead">
  <h1>每日一忆<span class="tick">。</span></h1>
  <p class="sub">照片库已按值得回忆度打过分，每天从「历史上的今天」里请出最好的一张，让沉睡的记忆重新被看见。</p>
  <div class="metrics">
    <div class="metric"><span class="num mono" id="mTotal">–</span><span class="label">已分析照片</span></div>
    <div class="metric"><span class="num mono" id="mAvg">–</span><span class="label">平均回忆度</span></div>
    <div class="metric"><span class="num mono" id="mHigh">–</span><span class="label">高分照片 <span class="mono">≥85</span></span></div>
    <div class="metric"><span class="num mono" id="mToday">–</span><span class="label">今日候选 <span class="mono" id="mTodayDate"></span></span></div>
  </div>
</section>

<section class="container picks" id="picksSection" hidden>
  <div class="section-head">
    <h2>今日选片</h2>
    <span class="mono muted">历史上的今天</span>
  </div>
  <div class="picks-row" id="picksRow"></div>
</section>

<main class="container layout">
  <section class="gallery-col">
    <div class="toolbar">
      <div class="chips" id="typeChips"></div>
      <div class="toolbar-right">
        <select id="sortSel" class="control">
          <option value="memory">按回忆度</option>
          <option value="beauty">按美观度</option>
          <option value="date">按拍摄日期</option>
        </select>
        <input id="searchInput" class="control" type="search" placeholder="搜索文案 / 城市…">
      </div>
    </div>
    <div class="grid" id="grid">
      <div class="empty-note">加载中…</div>
    </div>
  </section>

  <aside class="preview-col">
    <div class="device">
      <div class="device-frame">
        <img id="previewImg" class="screen" alt="墨水屏预览">
        <div class="screen-flash" id="screenFlash"></div>
      </div>
      <div class="device-meta mono">QUOTE/0 · 296×152 · 125 PPI · 1-BIT</div>
    </div>
    <div class="panel">
      <div class="panel-info mono" id="panelInfo">未选择照片</div>
      <div class="field">
        <label for="captionInput">屏上文案</label>
        <input id="captionInput" class="control" maxlength="24" placeholder="8–24 个字的画外之意">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="ditherTypeSel">抖动类型</label>
          <select id="ditherTypeSel" class="control">
            <option value="ORDERED" selected>有序抖动</option>
            <option value="DIFFUSION">误差扩散</option>
            <option value="NONE">关闭抖动</option>
          </select>
        </div>
        <div class="field" id="kernelField">
          <label for="ditherKernelSel">抖动算法</label>
          <select id="ditherKernelSel" class="control">
            <option value="FLOYD_STEINBERG">Floyd-Steinberg</option>
            <option value="ATKINSON">Atkinson</option>
            <option value="BURKES">Burkes</option>
            <option value="SIERRA2">Sierra2</option>
            <option value="STUCKI">Stucki</option>
            <option value="JARVIS_JUDICE_NINKE">Jarvis-Judice-Ninke</option>
            <option value="DIFFUSION_ROW">行扩散 Row</option>
            <option value="DIFFUSION_COLUMN">列扩散 Column</option>
            <option value="DIFFUSION_2D">二维扩散 2D</option>
            <option value="THRESHOLD">阈值 Threshold</option>
          </select>
          <div class="control control-static mono" id="kernelStatic" hidden></div>
        </div>
      </div>
      <div class="field">
        <label for="borderSel">屏幕边框</label>
        <select id="borderSel" class="control">
          <option value="0">白色</option>
          <option value="1">黑色</option>
        </select>
      </div>
      <button id="pushBtn" class="push-btn" disabled>推送到设备</button>
      <div id="pushMsg" class="push-msg" hidden></div>
      <p class="push-hint">每次推送生成独立碰一碰页面（原图 + 屏上效果），手机 NFC 触碰设备即可打开</p>
    </div>
  </aside>
</main>

<footer class="container footer">
  <span class="mono">InkTime console · MIT</span>
</footer>

<div id="pushMsg" class="toast" hidden></div>

<script src="/static/app.js?v=20260920b"></script>
<script src="/static/theme.js?v=20260920b"></script>
</body>
</html>
