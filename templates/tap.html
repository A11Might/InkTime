<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<script>
  /* 首帧前定主题，避免深色用户看到白闪 */
  (function () {
    var t = localStorage.getItem("inktime-theme");
    if (t !== "light" && t !== "dark") {
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<title>InkTime · {{ caption or '碰一碰' }}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/favicon-180.png">
<link rel="stylesheet" href="/static/style.css?v=20260920b">
</head>
<body class="tap-body">

<header class="topbar">
  <div class="container topbar-inner">
    <div class="topbar-left">
      <a class="brand" href="/" title="返回首页">InkTime<span class="brand-dot">.</span></a>
      <nav class="nav-tabs">
        <a class="nav-tab" href="/">工作台</a>
        <a class="nav-tab active" href="/latest">碰一碰</a>
      </nav>
    </div>
    <div class="topbar-right">
      <a class="gh-link" href="https://github.com/A11Might/InkTime" target="_blank" rel="noopener" aria-label="GitHub 仓库" title="GitHub 仓库">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
        <span class="ext-arrow" aria-hidden="true">↗</span>
      </a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="tap-main">
  {% set pw = 'min(100%, calc(72vh * (' ~ w ~ ' / ' ~ h ~ ')))' %}
  <figure class="tap-figure" style="--ar: {{ w }} / {{ h }}; --pw: {{ pw }};">
    <div class="tap-photo">
      <img src="/img/{{ id }}_orig.jpg" alt="">
    </div>
    <figcaption class="tap-info">
      <h1 class="tap-caption">{{ caption or '未命名的一瞬' }}</h1>
      {% if date or city %}
      <div class="tap-meta mono">
        {% if date %}<span>{{ date }}</span>{% endif %}
        {% if city %}<span>{{ city }}</span>{% endif %}
      </div>
      {% endif %}
    </figcaption>
  </figure>
</main>

<footer class="container footer tap-footer">
  <span class="mono">InkTime console · MIT</span>
</footer>

<script src="/static/theme.js?v=20260920b"></script>
</body>
</html>
